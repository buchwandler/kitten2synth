[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitten2synth"
version = "0.1.0.dev0"
description = "KittenTTS 2 synthesis from ONNX bundles using ONNXVoice asset management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "kitten2synth contributors"}]
dependencies = ["numpy>=1.23", "onnxvoice[kitten2]>=0.2.12,<0.3"]
keywords = ["kitten-tts", "tts", "onnx", "onnxruntime", "onnxvoice", "speech"]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu,kitten2]>=0.2.12,<0.3"]
gpu = ["onnxvoice[gpu,kitten2]>=0.2.12,<0.3"]
dev = ["pytest>=8", "ruff>=0.16,<0.18", "mypy>=1.11"]

[project.scripts]
kitten2synth = "kitten2synth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kitten2synth*"]

[tool.setuptools.package-data]
kitten2synth = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
